services:
  # Backend API Service (Node.js/Express)
  - type: web
    name: secure-medical-storage-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false  # Add this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false  # Add this manually in Render dashboard
    healthCheckPath: /
    autoDeploy: true

  # Frontend React App (Static Site)
  - type: web
    name: secure-medical-storage-web
    env: static
    region: oregon
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://secure-medical-storage-api.onrender.com
    autoDeploy: true

# IMPORTANT NOTES:
# 1. MongoDB Database: Use MongoDB Atlas (free tier) instead of hosting on Render
#    - Create account at: https://www.mongodb.com/cloud/atlas
#    - Get connection string and add to MONGODB_URI in Render dashboard
#
# 2. Environment Variables to Set in Render Dashboard:
#    - MONGODB_URI: Your MongoDB Atlas connection string
#    - OPENAI_API_KEY: Your OpenAI API key (if using AI features)
#    - JWT_SECRET: Will be auto-generated by Render
#
# 3. After deployment, update REACT_APP_API_URL with your actual backend URL
